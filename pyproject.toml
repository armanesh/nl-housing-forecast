[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-housing-forecast"
version = "0.1.0"
description = "Dutch housing price forecasting on BigQuery ML, with optional Vertex AI Model Registry deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Rahbarimanesh" }]
dependencies = [
    "google-cloud-bigquery>=3.20",
    "google-cloud-aiplatform>=1.60",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "db-dtypes>=1.2",
    "numpy>=1.24",
    "requests>=2.31",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0"]

[project.scripts]
housing = "housing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
